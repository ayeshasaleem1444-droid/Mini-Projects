<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>My Tasks</h1>

      <div class="inp-group">
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button id="addTaskBtn">+ Add</button>
      </div>

      <div class="counts">
        <div class="stat-box" id="totalCount">0 Total</div>
        <div class="stat-box" id="doneCount">0 Done</div>
        <div class="stat-box" id="remainingCount">0 Remaining</div>
      </div>

      <div class="filter-buttons">
        <button id="filterAll" class="btn active">All</button>
        <button id="filterActive" class="btn">Active</button>
        <button id="filterDone" class="btn">Done</button>
      </div>

      <div class="tasks-container" id="tasksList">
        <div class="empty-state">No tasks available</div>
      </div>

      <div id="clearCompletedBtn" class="clear-btn">
        <svg
          class="trash-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        Clear completed
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
