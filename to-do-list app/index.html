<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to do list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- main heading -->
      <h1>My Tasks</h1>
      <!-- input -->
      <div class="inp">
        <input type="text" placeholder=" Add a new task..." />
        <button onclick="addTask()">+ Add</button>
      </div>
      <!-- counts -->
      <div class="counts">
        <div class="three-divs" id="total">0 Total</div>
        <div class="three-divs" id="done">0 Done</div>
        <div class="three-divs" id="remaining">0 Remaining</div>
      </div>
      <!-- buttons -->
      <div class="three-buttons">
        <button onclick="all()" id="all" class="button">All</button>
        <button onclick="active()" id="active" class="button">Active</button>
        <button onclick="Done()" id="done" class="button">Done</button>
      </div>
      <!-- tasks -->
      <div class="tasks">no tasks are there</div>
      <!-- delete tasks -->
      <div id="delete">
        <svg
          class="trash-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        Clear completed
      </div>
    </div>
  </body>
</html>
