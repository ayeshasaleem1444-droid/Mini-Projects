<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quiz game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- start screen -->
      <div class="screen active" id="first-screen">
        <h1>Quiz Time</h1>
        <p>I dare you to answer these questions</p>
        <button id="start-button">Let's Start</button>
      </div>

      <!-- quiz screen -->
      <div class="screen" id="quiz-screen">
        <div class="quiz-header">
          <h2 id="question">question is here</h2>
          <div class="quiz-info">
            <p>Question <span id="question-numbers">1</span> of 5</p>
            <p>Score: <span id="score-number">0</span></p>
          </div>
        </div>
        <div id="option-container"></div>
        <div class="progress-bar">
          <div id="progress" class="progress"></div>
        </div>
      </div>

      <!-- Result screen -->
      <div class="screen" id="result-screen">
        <h1>Result Time</h1>
        <div class="result-div">
          <p>You scored <span id="got-score">0</span> out of 5</p>
          <div id="comment">good</div>
        </div>
        <button id="restart">Do it bro!</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
